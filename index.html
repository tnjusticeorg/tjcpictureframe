<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile Frame Maker</title>
<meta name="description" content="Add the #IGaveADamn banner to your profile picture. Everything runs in your browser; your photo is never uploaded.">
<style>
  :root{--bg:#f4f6f9;--card:#ffffff;--text:#1c2230;--muted:#5d6678;--line:#e1e5ec;--accent:#390461;--accent-text:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#11141a;--card:#1a1f28;--text:#e7eaf0;--muted:#9aa3b4;--line:#2b323e;--accent:#8a4fd1;--accent-text:#fff}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
  header{padding:28px 16px 4px;text-align:center}
  h1{margin:0;font-size:1.65rem;letter-spacing:-.01em}
  header p{margin:6px auto 0;color:var(--muted);max-width:560px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
  .stage.dragover{outline:3px dashed var(--accent);outline-offset:-8px}
  canvas{width:100%;max-width:480px;aspect-ratio:1/1;touch-action:none;cursor:grab;border-radius:50%;
    background:repeating-conic-gradient(#8881 0 25%,#0000 0 50%) 0 0/24px 24px}
  canvas:active{cursor:grabbing}
  .hint{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
  .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:999px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .btn.big{padding:13px 26px;font-size:1.05rem}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
  .zoom{width:100%;max-width:480px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600}
  .lbl{display:flex;justify-content:space-between}
  output{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:8px 16px 28px}
  /* Styles used only by the commented-out settings panel */
  .panel{display:flex;flex-direction:column;gap:14px}
  .panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 -4px}
  .panel label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<header>
  <h1>Profile Frame Maker</h1>
  <p>Upload a photo, position it, and save. Your photo stays on your device.</p>
</header>

<main>
  <section class="card stage" id="stage">
    <canvas id="cv" aria-label="Profile picture preview"></canvas>
    <p class="hint">Drag the photo to position it. Scroll, pinch or use the slider to zoom.</p>

    <div class="actions">
      <button class="btn" id="pick">Upload photo</button>
      <button class="btn" id="reset" disabled>Reset position</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <label class="zoom"><span class="lbl">Zoom <output id="zoomOut">100%</output></span>
      <input type="range" id="zoom" min="0.5" max="5" step="0.01" value="1"></label>

    <label class="zoom"><span class="lbl">Banner position <output id="posOut">Bottom</output></span>
      <input type="range" id="pos" min="-180" max="180" step="1" value="0"></label>

    <button class="btn primary big" id="save" disabled>Save to Photos</button>
    <p class="hint" id="saveHint" hidden>In the menu that opens, choose “Save Image”.</p>
    <button class="linkbtn" id="download" disabled hidden>Download the file instead</button>

    <!-- Copy-link button (disabled for now; banner settings are fixed in CFG in the script)
    <button class="btn" id="copylink">Copy link to this frame</button>
    -->
  </section>

  <!-- ===================== SETTINGS PANEL (commented out for now) =====================
       The banner is currently fixed by the CFG object at the top of the script.
       Uncommenting this markup alone will NOT reconnect these controls; they would
       need to be wired back into CFG in the script.

  <section class="card panel">
    <h2>Banner text</h2>
    <label>Text <input type="text" id="text" maxlength="48" value="Your text here" data-setting></label>
    <div class="grid2">
      <label>Font
        <select id="font" data-setting>
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="system-ui">System sans</option>
          <option value="Georgia">Serif</option>
        </select></label>
      <label>Text color <input type="color" id="tcolor" value="#ffffff" data-setting></label>
    </div>
    <label>Text size <input type="range" id="fsize" min="28" max="120" step="1" value="64" data-setting></label>
    <label>Letter spacing <input type="range" id="spacing" min="-4" max="24" step="1" value="2" data-setting></label>
    <label>Text offset <input type="range" id="toffset" min="-40" max="40" step="1" value="0" data-setting></label>
    <div class="grid2">
      <label><input type="checkbox" id="shadow" checked data-setting> Text shadow</label>
      <label>Shadow color <input type="color" id="scolor" value="#000000" data-setting></label>
    </div>

    <h2>Banner</h2>
    <div class="grid2">
      <label>Color #1 <input type="color" id="c1" value="#390461" data-setting></label>
      <label>Color #2 <input type="color" id="c2" value="#6a2c9e" data-setting></label>
    </div>
    <label>Thickness <input type="range" id="thick" min="60" max="260" step="1" value="150" data-setting></label>
    <label>Extra length <input type="range" id="pad" min="0" max="90" step="1" value="34" data-setting></label>
    <label>Position (rotate) <input type="range" id="pos" min="-180" max="180" step="1" value="0" data-setting></label>
    <label>Photo background <input type="color" id="bg" value="#dfe5ec" data-setting></label>
  </section>
  ================================================================================== -->
</main>

<footer>Made with plain HTML, CSS and JavaScript — no data leaves your browser.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ================= Banner settings (edit these to change the frame) =================
  const CFG = {
    bigText: '#IGaveADamn',
    smallText: 'tnjustice.org',
    bigSize: 66,          // px on the 1000px image
    smallSize: 42,        // px
    gap: 34,              // space between the hashtag and the URL, px
    spacing: 1,           // letter spacing, px
    font: 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
    weight: 700,
    textColor: '#ffffff',
    color: '#390461',     // solid banner color
    thick: 150,           // banner thickness, px
    padDeg: 12,           // banner length beyond the text on each side, degrees
    roundEnds: false,     // true = rounded ends, false = straight ends
    posDeg: 0,            // starting position: 0 = bottom, ±90 = sides, 180 = top
    bg: '#dfe5ec',        // shows behind transparent photos
    fileName: 'IGaveADamn-profile.png'
  };
  // ====================================================================================

  const SIZE = 1000, C = SIZE / 2, R = SIZE / 2;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  cv.width = cv.height = SIZE;

  const state = { img: null, x: 0, y: 0, scale: 1, pos: CFG.posDeg };
  let baseScale = 1;

  const fontFor = size => `${CFG.weight} ${size}px ${CFG.font}`;

  // ---------- drawing ----------
  function drawPlaceholder() {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 44px system-ui, sans-serif';
    ctx.fillText('Click or drop a photo', C, C - 70);
  }

  function drawBanner() {
    const thick = CFG.thick;
    const rMid = R - thick / 2;
    const rText = rMid;
    const center = Math.PI / 2 + state.pos * Math.PI / 180; // 0° = bottom
    const onTop = Math.sin(center) < -1e-6;                  // top half: flip so text stays upright

    // Glyph list: hashtag (big), a gap, then the URL (small)
    const glyphs = [];
    [...CFG.bigText].forEach(ch => glyphs.push({ ch, size: CFG.bigSize }));
    glyphs.push({ ch: null, w: CFG.gap });
    [...CFG.smallText].forEach(ch => glyphs.push({ ch, size: CFG.smallSize }));
    glyphs.forEach(g => {
      if (g.ch === null) return;
      ctx.font = fontFor(g.size);
      g.w = ctx.measureText(g.ch).width + CFG.spacing;
    });
    const textAng = glyphs.reduce((s, g) => s + g.w, 0) / rText;
    const pad = CFG.padDeg * Math.PI / 180;
    const span = Math.min(textAng + 2 * pad, Math.PI * 2);
    const a0 = center - span / 2, a1 = center + span / 2;

    // Banner band: solid color
    ctx.beginPath();
    ctx.arc(C, C, rMid, a0, a1);
    ctx.strokeStyle = CFG.color;
    ctx.lineWidth = thick;
    ctx.lineCap = CFG.roundEnds && span < Math.PI * 2 ? 'round' : 'butt';
    ctx.stroke();

    // Text along the arc, one character at a time, sharing one baseline
    ctx.save();
    ctx.fillStyle = CFG.textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    const baselineShift = CFG.bigSize * 0.36; // centers the hashtag's capitals in the band
    let a = onTop ? center - textAng / 2 : center + textAng / 2;
    const dir = onTop ? 1 : -1;
    glyphs.forEach(g => {
      const half = g.w / 2 / rText;
      a += dir * half;
      if (g.ch !== null) {
        ctx.save();
        ctx.translate(C + rText * Math.cos(a), C + rText * Math.sin(a));
        ctx.rotate(onTop ? a + Math.PI / 2 : a - Math.PI / 2);
        ctx.font = fontFor(g.size);
        ctx.fillText(g.ch, 0, baselineShift);
        ctx.restore();
      }
      a += dir * half;
    });
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.save();
    ctx.beginPath();
    ctx.arc(C, C, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = CFG.bg;
    ctx.fillRect(0, 0, SIZE, SIZE);
    if (state.img) {
      const s = baseScale * state.scale;
      const w = state.img.naturalWidth * s, h = state.img.naturalHeight * s;
      ctx.drawImage(state.img, C - w / 2 + state.x, C - h / 2 + state.y, w, h);
    } else {
      drawPlaceholder();
    }
    drawBanner();
    ctx.restore();
    if (state.img) refreshFile();
  }

  // ---------- loading a photo ----------
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) { toast('Please choose an image file.'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      state.img = img;
      baseScale = Math.max(SIZE / img.naturalWidth, SIZE / img.naturalHeight); // cover the circle
      URL.revokeObjectURL(url);
      ['save', 'download', 'reset'].forEach(id => $(id).disabled = false);
      resetPhoto();
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't read that image. Try a JPG or PNG."); };
    img.src = url;
  }
  function resetPhoto() {
    state.x = 0; state.y = 0;
    setScale(1);
    draw();
  }
  function setScale(s) {
    state.scale = Math.min(5, Math.max(0.5, s));
    $('zoom').value = state.scale;
    $('zoomOut').textContent = Math.round(state.scale * 100) + '%';
  }

  $('pick').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('reset').onclick = resetPhoto;
  $('zoom').oninput = e => { setScale(+e.target.value); draw(); };

  // Banner position slider: 0 = bottom, ±90 = sides, ±180 = top
  function posLabel(d) {
    const a = Math.abs(d);
    if (a <= 10) return 'Bottom';
    if (a >= 170) return 'Top';
    const side = d > 0 ? 'Left' : 'Right';
    if (a >= 80 && a <= 100) return side;
    return (a < 90 ? 'Bottom ' : 'Top ') + side.toLowerCase();
  }
  function setPos(d) {
    state.pos = d;
    $('pos').value = d;
    $('posOut').textContent = posLabel(d);
  }
  $('pos').oninput = e => { setPos(+e.target.value); draw(); };
  setPos(CFG.posDeg);

  // Drag & drop a file onto the preview card
  const stage = $('stage');
  ['dragenter', 'dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('dragover'); }));
  stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

  // ---------- drag / pinch / wheel to position ----------
  const pts = new Map();
  let pinch = null;
  const dist = () => { const [p, q] = [...pts.values()]; return Math.hypot(p.x - q.x, p.y - q.y) || 1; };
  cv.addEventListener('click', () => { if (!state.img) $('file').click(); });
  cv.addEventListener('pointerdown', e => {
    if (!state.img) return;
    cv.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) pinch = { d: dist(), s: state.scale };
  });
  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const k = SIZE / cv.getBoundingClientRect().width; // CSS px -> canvas px
    if (pts.size === 1) { state.x += (e.clientX - p.x) * k; state.y += (e.clientY - p.y) * k; }
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2 && pinch) setScale(pinch.s * dist() / pinch.d);
    draw();
  });
  const endPointer = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('wheel', e => {
    if (!state.img) return;
    e.preventDefault();
    setScale(state.scale * Math.exp(-e.deltaY * 0.0015));
    draw();
  }, { passive: false });

  // ---------- saving ----------
  // Browsers can't write straight into the Photos app. On phones that support it,
  // "Save to Photos" opens the system share sheet with the image, where the person
  // taps "Save Image". Elsewhere (most desktops, some in-app browsers) it downloads the file.
  let cachedFile = null, fileTimer = null;
  function refreshFile() {           // keep a ready-made file so sharing starts instantly on tap
    cachedFile = null;
    clearTimeout(fileTimer);
    fileTimer = setTimeout(() => cv.toBlob(b => {
      if (b) cachedFile = new File([b], CFG.fileName, { type: 'image/png' });
    }, 'image/png'), 250);
  }
  function fileNow() {               // synchronous fallback if the cached file isn't ready yet
    if (cachedFile) return cachedFile;
    const bin = atob(cv.toDataURL('image/png').split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new File([bytes], CFG.fileName, { type: 'image/png' });
  }
  function downloadFile(file) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = CFG.fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  let canShareFiles = false;
  try {
    canShareFiles = !!(navigator.share && navigator.canShare &&
      navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] }));
  } catch { canShareFiles = false; }

  if (canShareFiles) {
    $('saveHint').hidden = false;
    $('download').hidden = false;
  } else {
    $('save').textContent = 'Download image';
  }

  $('save').onclick = () => {
    const file = fileNow();
    if (!canShareFiles) { downloadFile(file); return; }
    navigator.share({ files: [file] }).catch(err => {
      if (err && err.name === 'AbortError') return;   // person closed the menu
      downloadFile(file);                              // sharing blocked: fall back to a download
    });
  };
  $('download').onclick = () => downloadFile(fileNow());

  /* ---------- Copy-link-to-frame (disabled along with the settings panel) ----------
  const settingEls = [...document.querySelectorAll('[data-setting]')];
  function frameUrl() {
    const p = new URLSearchParams();
    settingEls.forEach(el => p.set(el.id, el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value));
    return location.origin + location.pathname + '?' + p.toString();
  }
  $('copylink').onclick = async () => {
    const url = frameUrl();
    try { await navigator.clipboard.writeText(url); toast('Link copied.'); }
    catch { prompt('Copy this link:', url); }
  };
  ---------------------------------------------------------------------------------- */

  // ---------- misc ----------
  let tTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tTimer); tTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  draw();
})();
</script>
</body>
</html>
